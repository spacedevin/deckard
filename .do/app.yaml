# DigitalOcean App Platform spec — Deckard.   TWO components, ONE domain:
#   • web      : the browser DAW. It is a STATIC, client-side bundle, so it MUST be a `static_sites` component
#                (CDN-served, no health check, free). Deploying it as a Web Service is THE bug behind
#                "container did not respond to health checks" — a static bundle has nothing listening on a port.
#   • gateway  : the Co-DJ multiplayer WebSocket hub — a Docker `service` (the only paid, always-on piece).
# Ingress routes /codj -> gateway and everything else -> web; the browser talks to the gateway same-origin at
# wss://<app-domain>/codj (see CoDjPanel's defaultWsUrl()).
#
# APPLY THIS to fix the failing deploy — DO console: your app -> Settings -> "App Spec" -> Edit -> paste this
# whole file -> Save. (Or `doctl apps update <APP_ID> --spec .do/app.yaml`.) That replaces the mis-detected
# buildpack Web Service with the static site + gateway.  `name`/`region` below match your existing app so it
# edits in place. Want only the free static site? Delete the `services:` block + the `/codj` ingress rule.
name: deckard-one
region: sfo

static_sites:
  - name: web
    github:
      repo: spacedevin/deckard
      branch: main
      deploy_on_push: true
    # Compiles the Tish app then assembles ./build (index.html, workers/worklets, mespeak assets). See
    # scripts/build-static.mjs. pnpm is pinned to 9 in package.json so @tishlang/tish's postinstall runs.
    build_command: npm run build:static
    output_dir: build
    index_document: index.html
    catchall_document: index.html
    environment_slug: node-js

services:
  - name: gateway
    github:
      repo: spacedevin/deckard
      branch: main
      deploy_on_push: true
    # Pure Tish: services/gateway/main.tish is compiled to a native binary and run on a distroless image
    # (services/gateway/Dockerfile — no Node/JS in the runtime). Build context = repo root.
    dockerfile_path: services/gateway/Dockerfile
    source_dir: /
    # The gateway speaks WebSocket only and listens on CODJ_HUB_PORT (it reads that first, then $PORT). We pin
    # it to 8080 explicitly — matching http_port — so the bind never depends on how App Platform injects $PORT.
    http_port: 8080
    envs:
      - key: CODJ_HUB_PORT
        scope: RUN_TIME
        value: "8080"
    instance_size_slug: basic-xxs
    instance_count: 1
    # WS-only service: omit http_path so App Platform uses a TCP health check (the open WS port = healthy).
    health_check:
      initial_delay_seconds: 15
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 5

ingress:
  rules:
    - match:
        path:
          prefix: /codj
      component:
        name: gateway
    - match:
        path:
          prefix: /
      component:
        name: web
