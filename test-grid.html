<!DOCTYPE html>
<html>
<style>
.seq-session-wrap { padding: 20px; background: #000; }
.panel-grid {
  display: grid;
  grid-template-columns: 1fr 460px;
  gap: 0 14px;
}
.panel-bg-left { grid-column: 1; grid-row: 1 / -1; background: #16161c; border: 1px solid #23232b; border-radius: 8px; }
.panel-bg-right { grid-column: 2; grid-row: 1 / -1; background: #16161c; border: 1px solid #23232b; border-radius: 8px; }
.grid-header { display: contents; }
.grid-header > .left { grid-column: 1; padding: 14px; }
.grid-header > .right { grid-column: 2; padding: 14px; }
.grid-track { display: contents; }
.grid-track > .left { grid-column: 1; padding: 0 14px 5px; }
.grid-track > .right { grid-column: 2; padding: 0 14px 5px; }
</style>
<div class="seq-session-wrap">
  <div class="panel-grid">
    <div class="panel-bg-left"></div>
    <div class="panel-bg-right"></div>
    <div class="grid-header">
      <div class="left">Step Grid Header</div>
      <div class="right">Session Header</div>
    </div>
    <div class="grid-track">
      <div class="left">Track 1 Seq</div>
      <div class="right">Track 1 Session (taller maybe)</div>
    </div>
  </div>
</div>
</html>
