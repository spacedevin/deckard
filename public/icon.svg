<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Deckard">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#211b25"/>
      <stop offset="1" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8b27a"/>
      <stop offset="1" stop-color="#dc6d32"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="224" cy="256" r="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d1a22"/>
      <stop offset="1" stop-color="#09080c"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="half">
      <rect x="224" y="0" width="288" height="512"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(1.14) translate(-256 -256)">
    <!-- the D: a fader stem and a half-record bowl -->
    <g filter="url(#lift)">
      <rect x="144" y="112" width="64" height="288" rx="16" fill="url(#warm)"/>
      <path d="M224 112 A144 144 0 0 1 224 400 Z" fill="url(#warm)"/>
    </g>

    <!-- the record in the bowl -->
    <g clip-path="url(#half)">
      <circle cx="224" cy="256" r="118" fill="url(#vinyl)"/>
      <circle cx="224" cy="256" r="106" fill="none" stroke="#2c2832" stroke-width="2"/>
      <circle cx="224" cy="256" r="95" fill="none" stroke="#25222b" stroke-width="2"/>
      <circle cx="224" cy="256" r="84" fill="none" stroke="#2c2832" stroke-width="2"/>
      <circle cx="224" cy="256" r="73" fill="none" stroke="#25222b" stroke-width="2"/>
      <circle cx="224" cy="256" r="62" fill="none" stroke="#2c2832" stroke-width="2"/>
      <path d="M224 256 L286 156 A118 118 0 0 1 340 226 Z" fill="url(#sheen)"/>
      <circle cx="224" cy="256" r="38" fill="url(#warm)"/>
    </g>
    <circle cx="224" cy="256" r="7" fill="#07070a"/>

    <!-- cue marker on the record -->
    <line x1="254" y1="226" x2="302" y2="178" stroke="#7cff7c" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>

    <!-- step pads in the stem: x . x . -->
    <rect x="160" y="140" width="32" height="40" rx="7" fill="#7cff7c" filter="url(#glow)"/>
    <rect x="160" y="200" width="32" height="40" rx="7" fill="#000000" fill-opacity="0.32"/>
    <rect x="160" y="272" width="32" height="40" rx="7" fill="#7cff7c" filter="url(#glow)"/>
    <rect x="160" y="332" width="32" height="40" rx="7" fill="#000000" fill-opacity="0.32"/>
  </g>
</svg>
